<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/standard.css">
    <title>El Pollo Loco Game</title>
    <link rel="icon" type="image/x-icon" href="img/6_salsa_bottle/1_salsa_bottle_on_ground.png">

    <script src="js/models/drawable-object.class.js"></script>
    <script src="js/models/movable-object.class.js"></script>
    <script src="js/models/character.class.js"></script>
    <script src="js/models/floating-text.class.js"></script>
    <script src="js/models/collectables.class.js"></script>
    <script src="js/models/bottle.class.js"></script>
    <script src="js/models/coin.class.js"></script>
    <script src="js/models/chicken.class.js"></script>
    <script src="js/models/chicken-small.class.js"></script>
    <script src="js/models/cloud.class.js"></script>
    <script src="js/models/background-object.class.js"></script>
    <script src="js/models/status-bar.class.js"></script>
    <script src="js/models/status-bar-health.class.js"></script>
    <script src="js/models/status-bar-score.class.js"></script>
    <script src="js/models/status-bar-ammo.class.js"></script>
    <script src="js/models/status-bar-boss.class.js"></script>
    <script src="js/models/world.class.js"></script>
    <script src="js/models/keyboard.class.js"></script>
    <script src="js/models/endboss.class.js"></script>
    <script src="js/models/throwable-object.class.js"></script>
    <script src="js/models/level.class.js"></script>
    <script src="js/levels/level1.js"></script>
    <script src="js/game.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/script.js"></script>
</head>

<body onload="init()">

    <h1>El Pollo Loco</h1>
    <section class="game-section">
        <button id="button_mute" onclick="toggleMute()" class="button-mute button-img"><img
                src="./assets/icons/music.png" alt="Sound ON Icon"></button>
        <button id="button_music" onclick="toggleMusic()" class="button-music button-img"><img
                src="./assets/icons/sound.png" alt="Music ON Icon"></button>
        <button class="button-fullscreen button-img"><img src="./assets/icons/fullscreen.png" alt="Fullscreen Icon"></button>
        <button class="button-right"><img src="./assets/icons/arrow_right.png" alt="Arrow Right"></button>
        <button class="button-left"><img src="./assets/icons/arrow_left.png" alt="Arrow Left"></button>
        <button class="button-throw">D</button>
        <button class="button-jump"><img src="./assets/icons/arrow_up.png" alt="Arrow Up"></button>
        <canvas id="canvas" width="720" height="480"></canvas>
    </section>

    

    <dialog id="dialog" class="dialog">
    </dialog>


</body>

</html>
