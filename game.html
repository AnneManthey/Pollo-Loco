<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="styles//fullscreen.css">
    <link rel="stylesheet" href="styles/media.css">
    <title>El Pollo Loco Game</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.png">

    <script src="js/models/drawable-object.class.js"></script>
    <script src="js/models/movable-object.class.js"></script>
    <script src="js/models/character.class.js"></script>
    <script src="js/models/floating-text.class.js"></script>
    <script src="js/models/collectables.class.js"></script>
    <script src="js/models/bottle.class.js"></script>
    <script src="js/models/coin.class.js"></script>
    <script src="js/models/chicken.class.js"></script>
    <script src="js/models/chicken-small.class.js"></script>
    <script src="js/models/cloud.class.js"></script>
    <script src="js/models/background-object.class.js"></script>
    <script src="js/models/status-bar.class.js"></script>
    <script src="js/models/status-bar-health.class.js"></script>
    <script src="js/models/status-bar-score.class.js"></script>
    <script src="js/models/status-bar-ammo.class.js"></script>
    <script src="js/models/status-bar-boss.class.js"></script>
    <script src="js/models/world-collision-system.class.js"></script>
    <script src="js/models/world-renderer.class.js"></script>
    <script src="js/models/world.class.js"></script>
    <script src="js/models/keyboard.class.js"></script>
    <script src="js/models/endboss.class.js"></script>
    <script src="js/models/throwable-object.class.js"></script>
    <script src="js/models/level.class.js"></script>
    <script src="js/levels/level1.js"></script>
    <script src="js/game.js"></script>
    <script src="js/audio-controls.js"></script>
    <script src="js/fullscreen-controls.js"></script>
    <script src="js/templates.js"></script>
</head>

<body onload="init()">

    <div id="loading_screen" class="loading-overlay">
        <div class="spinner-container">
            <div class="chicken-spinner"></div>

            <div id="loading_info" class="loading-text">
                Loading... Did you know? Small Chickens are highly jumpable!
            </div>
        </div>
    </div>

    <h1 translate="no">El Pollo Loco</h1>
    <section id="game_fullscreen" class="game-section">
        <button id="button_mute" onclick="toggleMute()" class="button-mute button-img"><img
            src="./assets/icons/music.png" alt="Sound ON Icon" draggable="false"></button>
        <button id="button_music" onclick="toggleMusic()" class="button-music button-img"><img
            src="./assets/icons/sound.png" alt="Music ON Icon" draggable="false"></button>
        <button id="button_fullscreen" class="button-fullscreen button-img"><img src="./assets/icons/fullscreen.png"
            alt="Fullscreen Icon" draggable="false"></button>
       
        <button id="button_left" class="button-left">Walk Left</button>
        <button id="button_throw" class="button-throw">Throw</button>
        <button id="button_jump" class="button-jump">Jump</button>
        <button id="button_right" class="button-right">Walk Right</button>
        <canvas id="canvas" width="720" height="480"></canvas>
    </section>

    <p class="device-message">Please turn your device to play</p>
    <button class="button-nav"><a href="index.html">Back to Main</a></button>



    <dialog id="dialog" class="dialog">
    </dialog>

    <footer>
        <a href="index.html"><img src="./assets/icons/favicon.png" alt="Cactus Logo"></a>
        <p>Coded by Anne Manthey, July 2026</p>
    </footer>

</body>

</html>
