<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="styles//fullscreen.css">
    <link rel="stylesheet" href="styles/media.css">
    <title>El Pollo Loco - Controls</title>
    <script src="js/game.js"></script>
    <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.png">
</head>

<body>

    <h1>Controls</h1>

    <main>
        <section class="control-section">

        <table>
            <tr>
                <th>Move Right :</th>
                <td><img src="./assets/icons/arrow_right.png" alt="Arrow Right"></td>
            </tr>
            <tr>
                <th>Move Left :</th>
                <td><img src="./assets/icons/arrow_left.png" alt="Arrow Left"></td>
            </tr>
            <tr>
                <th>Jump :</th>
                <td><img src="./assets/icons/arrow_up.png" alt="Arrow Up"></td>
            </tr>
            <tr>
                <th>Throw Bottle :</th>
                <td style="font-size: 3.5rem;">B</td>
            </tr>
        </table>

    </section>

        <button class="button-nav"><a href="index.html">Back to Main</a></button>
    </main>
        
    <footer>
        <a href="index.html"><img src="./assets/icons/favicon.png" alt="Cactus Logo"></a>
        <p>Coded by Anne Manthey, July 2026</p>
    </footer>

</html>
