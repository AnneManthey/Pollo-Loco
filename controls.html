<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/standard.css">
    <title>El Pollo Loco - Controls</title>
    <script src="js/game.js"></script>
    <script src="js/templates.js"></script>
    <link rel="icon" type="image/x-icon" href="img/6_salsa_bottle/1_salsa_bottle_on_ground.png">
</head>

<body>

    <h1>Controls</h1>

    <section class="control-section">

        <table>
            <tr>
                <th>Move Right :</th>
                <td><img src="./assets/icons/arrow_right.png" alt="Arrow Right"></td>
            </tr>
            <tr>
                <th>Move Left :</th>
                <td><img src="./assets/icons/arrow_left.png" alt="Arrow Left"></td>
            </tr>
            <tr>
                <th>Jump :</th>
                <td><img src="./assets/icons/arrow_up.png" alt="Arrow Up"></td>
            </tr>
            <tr>
                <th>Throw Bottle :</th>
                <td style="font-size: 3.5rem;">B</td>
            </tr>
        </table>

    </section>



    <footer>
        <button class="button-nav"><a href="index.html">Back</a></button>
    </footer>
</body>

</html>
